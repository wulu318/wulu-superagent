name: Build WULU SuperAgent

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            npm_script: dist:win
            artifact: wulu-win-x64
          - os: macos-latest
            npm_script: dist:mac
            artifact: wulu-mac-arm64
          - os: ubuntu-latest
            npm_script: dist:linux
            artifact: wulu-linux-x64
          - os: ubuntu-latest
            npm_script: dist:linux:arm64
            artifact: wulu-linux-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0

      - name: Setup QEMU (Linux ARM64 cross-compile)
        if: matrix.artifact == 'wulu-linux-arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build
        run: npm run ${{ matrix.npm_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
          retention-days: 30

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: find dist -type f | head -50

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nightly:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: find dist -type f | head -50

      - name: Delete existing nightly release
        run: |
          # Cleanly remove the previous nightly release so assets are
          # re-uploaded from scratch, avoiding GitHub API race conditions
          # when overwriting same-named assets in place.
          if gh release view nightly --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release delete nightly --repo ${{ github.repository }} --yes --cleanup-tag || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Nightly Build (latest main)"
          files: dist/**/*
          body: |
            Automated nightly build from the latest `main` branch.

            **Commit:** ${{ github.sha }}
            **Date:** ${{ github.event.head_commit.timestamp }}

            Includes builds for:
            - Windows x64 (installer)
            - macOS ARM64 (DMG)
            - Linux x64 (AppImage + deb + rpm)
            - Linux ARM64 (AppImage + deb + rpm) - UOS/Kylin/openEuler
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}