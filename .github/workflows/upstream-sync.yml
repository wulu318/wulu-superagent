name: Upstream Sync

on:
  schedule:
    - cron: '0 2 * * *'   # 每天北京时间 10:00 检测
  workflow_dispatch:        # 手动触发

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "WULU Bot"
          git config user.email "bot@wulu-superagent.dev"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/netease-youdao/LobsterAI.git
          git fetch upstream main

      - name: Check for changes
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No upstream changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Upstream has new commits: $UPSTREAM"
          fi

      - name: Merge upstream
        if: steps.check.outputs.changed == 'true'
        run: |
          git checkout -b upstream-sync/${{ github.run_number }}
          git merge upstream/main --no-edit || true

          # 自动保留 WULU 品牌文件（解决冲突时优先使用我们的版本）
          BRAND_FILES=(
            "src/brand.ts"
            "src/renderer/styles/wulu-theme.css"
            "LICENSE"
            ".github/workflows/upstream-sync.yml"
          )
          for f in "${BRAND_FILES[@]}"; do
            if [ -f "$f" ]; then
              git checkout --ours "$f" 2>/dev/null || true
            fi
          done

          # 检查是否还有未解决的冲突
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::warning::Unresolved conflicts in: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            # 标记冲突文件，在 PR 中提示手动解决
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
          else
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
          fi

          git add -A
          git commit -m "chore: sync upstream LobsterAI $(date +%Y-%m-%d)" || true

      - name: Create Pull Request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: upstream-sync/${{ github.run_number }}
          title: 'chore: sync upstream LobsterAI'
          body: |
            ## 上游同步

            自动检测到 [netease-youdao/LobsterAI](https://github.com/netease-youdao/LobsterAI) 上游有新提交，已自动合并。

            ### 品牌文件自动保留
            以下文件已自动保留 WULU 版本，无需手动处理：
            - `src/brand.ts`
            - `src/renderer/styles/wulu-theme.css`
            - `LICENSE`
            - `.github/workflows/upstream-sync.yml`

            ### 操作指引
            1. 检查变更内容
            2. 如有冲突文件，手动解决后合并
            3. 测试通过后合并此 PR
          labels: |
            upstream-sync
            automated
